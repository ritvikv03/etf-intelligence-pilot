[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-pilot"
version = "0.1.0"
description = "Offline-first ETF competitive-intelligence pilot (Milestone 1 vertical slice)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "PyYAML>=6.0", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etf_pilot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
